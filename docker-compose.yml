# Run the studio on one machine (no HTTPS): http://<host>:3000
#   cp .env.example .env   → GEMINI_API_KEY, STUDIO_ADMIN_PASSWORD
#   docker compose up -d --build
# For the Telegram Mini App with HTTPS use Project1's docker-compose.yml on the VPS.
#
# ── VoxCPM2 voice cloning is NOT run here any more ──
# The 48kHz voice-clone model needs a GPU and a ~5 GB download, which a normal VPS
# does not have. It now runs on a free Colab/Kaggle GPU instead (voxcpm_server/
# VoxCPM2_Colab_Server.ipynb). A Pro user opens that notebook from the Telegram bot
# (the /voxcpm deeplink), runs it, and pastes the public URL it prints into the
# studio's Account tab (or set VOXCPM_API_URL in .env). Without a URL the studio
# still dubs with the built-in Khmer neural voices.
services:
  studio:
    build: .
    container_name: khmer-dubber
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - STUDIO_PUBLIC_MODE=1
      # Leave VOXCPM_API_URL unset here: a Pro user's Colab GPU URL is pasted in the
      # Account tab at runtime. Set it in .env only if you have a permanent VoxCPM2 server.
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./samples:/app/samples
